<!-- Galeria de Fotos -->
<section id="galeria" class="section" aria-labelledby="galeria-heading">
  <div class="container">
    <div class="section-header">
      <span class="section-eyebrow">Nossa Comunidade</span>
      <h2 id="galeria-heading" class="section-title">Galeria de Fotos</h2>
      <p class="section-lead">Registros autênticos dos cultos, acampamentos e encontros de oração.</p>
    </div>
    <div class="gallery-filters" role="tablist">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="cultos">Cultos</button>
      <button class="filter-btn" data-filter="desbravadores">Desbravadores</button>
      <button class="filter-btn" data-filter="acao_social">Ação Social</button>
      <button class="filter-btn" data-filter="estudos">Estudos Bíblicos</button>
      <button class="filter-btn" data-filter="jovens">Jovens & Louvor</button>
      <button class="filter-btn" data-filter="saude">Saúde</button>
    </div>
    <div class="gallery-grid" id="gallery-posts-container" aria-live="polite"></div>
  </div>
</section>
