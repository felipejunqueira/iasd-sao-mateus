<!-- Galeria de Fotos -->
<section id="galeria" class="section" aria-labelledby="galeria-heading">
  <div class="container">
    <div class="section-header">
      <span class="section-eyebrow" data-i18n="gallery.eyebrow">Nossa Comunidade</span>
      <h2 id="galeria-heading" class="section-title" data-i18n="gallery.title">Galeria de Fotos</h2>
      <p class="section-lead" data-i18n="gallery.lead">Registros autênticos dos cultos, acampamentos e encontros de oração.</p>
    </div>
    <div class="gallery-filters" role="tablist">
      <button class="filter-btn active" data-filter="todos"><span data-i18n="gallery.f_all">Todos</span></button>
      <button class="filter-btn" data-filter="cultos"><span data-i18n="gallery.f_cultos">Cultos</span></button>
      <button class="filter-btn" data-filter="desbravadores"><span data-i18n="gallery.f_desbravadores">Desbravadores</span></button>
      <button class="filter-btn" data-filter="acao_social"><span data-i18n="gallery.f_social">Ação Social</span></button>
      <button class="filter-btn" data-filter="estudos"><span data-i18n="gallery.f_estudos">Estudos Bíblicos</span></button>
      <button class="filter-btn" data-filter="jovens"><span data-i18n="gallery.f_jovens">Jovens & Louvor</span></button>
      <button class="filter-btn" data-filter="saude"><span data-i18n="gallery.f_saude">Saúde</span></button>
    </div>
    <div class="gallery-grid" id="gallery-posts-container" aria-live="polite"></div>
  </div>
</section>
