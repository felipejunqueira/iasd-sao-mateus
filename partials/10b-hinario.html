<!-- Hinário Adventista - IASD São Mateus -->
<section id="hinario" class="section hinario-section" aria-labelledby="hinario-heading">
  <div class="container">
    <div class="section-header">
      <span class="section-eyebrow" data-i18n="hinario.eyebrow">Louvor e Adoração</span>
      <h2 id="hinario-heading" class="section-title" data-i18n="hinario.title">Hinário Adventista</h2>
      <p class="section-lead" data-i18n="hinario.lead">Acompanhe as letras dos hinos sagrados durante os cultos e momentos de louvor comunitário.</p>
    </div>

    <div class="hinario-search-wrap">
      <div class="hinario-input-box">
        <svg class="hinario-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="hinario-search" type="search" class="hinario-input" placeholder="Buscar por número ou nome do hino..." aria-label="Buscar hino por número ou título">
      </div>
      <div class="hinario-chips" role="group" aria-label="Hinos sugeridos para o culto">
        <span class="hinario-chips-label">Sugeridos hoje:</span>
        <button type="button" class="hinario-chip" data-num="283">#283 O Sábado Chegou</button>
        <button type="button" class="hinario-chip" data-num="290">#290 Santo Sábado</button>
        <button type="button" class="hinario-chip" data-num="33">#33 Quão Grande És Tu</button>
        <button type="button" class="hinario-chip" data-num="500">#500 Tudo Por Cristo</button>
      </div>
    </div>

    <div id="hinario-list" class="hinario-grid" aria-live="polite"></div>
  </div>
</section>

<!-- Modal da Letra do Hino -->

        <h3 id="hinario-modal-title" class="hinario-modal-title"></h3>
        <p id="hinario-modal-author" class="hinario-modal-author"></p>
      </div>
      <div class="hinario-modal-actions">
        <button id="hinario-font-btn" class="btn-hinario-tool" title="Ajustar tamanho da fonte" aria-label="Ajustar tamanho da fonte">A<span style="font-size:1.15em">A</span></button>
        <button id="hinario-copy-btn" class="btn-hinario-tool" title="Copiar Letra" aria-label="Copiar letra do hino">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
